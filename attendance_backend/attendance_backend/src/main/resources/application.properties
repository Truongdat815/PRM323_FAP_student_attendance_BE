spring.application.name=attendance_backend

# Server Configuration
server.port=8080
server.forward-headers-strategy=framework

# MySQL Database Configuration
spring.datasource.url=jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:fap_attendance_db}?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true&createDatabaseIfNotExist=true
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:12345}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA / Hibernate Configuration
spring.jpa.hibernate.ddl-auto=create
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# Google Sheets Database Configuration (Optional / Fallback)
google.sheets.credentials-path=classpath:credentials.json
google.sheets.spreadsheet-id=${GOOGLE_SPREADSHEET_ID:1AbCdEfGhIjKlMnOpQrStUvWxYz123456789}
google.sheets.application-name=FAP-Attendance-System

# JWT Security Configuration
jwt.secret=404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970
jwt.expiration-ms=86400000
